/* =========================
   TEXT SCRAMBLE
========================= */

class TextScramble{

    constructor(el){

        this.el = el;

        this.chars =
            "!<>-_\\/[]{}—=+*^?#";

        this.update =
            this.update.bind(this);

        this.frameRequest = null;
    }

    setText(text){

        const oldText =
            this.el.innerText || "";

        const length =
            Math.max(
                oldText.length,
                text.length
            );

        this.queue = [];

        for(let i=0;i<length;i++){

            const from =
                oldText[i] || "";

            const to =
                text[i] || "";

            this.queue.push({
                from,
                to,
                start:
                    Math.floor(Math.random()*25),
                end:
                    20 +
                    Math.floor(Math.random()*30)
            });

        }

        cancelAnimationFrame(
            this.frameRequest
        );

        this.frame = 0;

        this.update();
    }

    update(){

        let output = "";

        let complete = 0;

        for(const item of this.queue){

            if(this.frame >= item.end){

                complete++;

                output += item.to;

            }else if(this.frame >= item.start){

                if(
                    !item.char ||
                    Math.random()<.25
                ){

                    item.char =
                        this.randomChar();

                }

                output +=
                    `<span style="color:var(--green)">${item.char}</span>`;

            }else{

                output += item.from;

            }

        }

        this.el.innerHTML = output;

        if(
            complete ===
            this.queue.length
        ){
            return;
        }

        this.frameRequest =
            requestAnimationFrame(
                this.update
            );

        this.frame++;
    }

    randomChar(){

        return this.chars[
            Math.floor(
                Math.random() *
                this.chars.length
            )
        ];

    }

}

    bgParticles =
        Array.from(
            {
                length:
                    window.innerWidth < 700
                    ? 35
                    : 65
            },
            createBgParticle
        );
}

function createBgParticle(){

    return{

        x:
            Math.random() *
            window.innerWidth,

        y:
            Math.random() *
            window.innerHeight,

        vx:
            (Math.random()-.5)*.25,

        vy:
            (Math.random()-.5)*.25,

        size:
            Math.random()*1.8+.5
    };
}

function animateBackground(){

    bgCtx.clearRect(
        0,
        0,
        bgCanvas.width,
        bgCanvas.height
    );

    bgParticles.forEach(p=>{

        p.x += p.vx;

        p.y += p.vy;

        if(p.x<0)
            p.x =
                bgCanvas.width;

        if(p.x>bgCanvas.width)
            p.x = 0;

        if(p.y<0)
            p.y =
                bgCanvas.height;

        if(p.y>bgCanvas.height)
            p.y = 0;

        bgCtx.beginPath();

        bgCtx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        bgCtx.fillStyle =
            "rgba(0,255,102,.35)";

        bgCtx.fill();

    });

    requestAnimationFrame(
        animateBackground
    );
}

/* =========================

========================= */

let startX = 0;

let startY = 0;

render.canvas.addEventListener(
    "pointerdown",
    e=>{

        startX =
            e.clientX;

        startY =
            e.clientY;
    }
);

render.canvas.addEventListener(
    "pointerup",
    e=>{

        const moveDist =
            Math.hypot(
                e.clientX-startX,
                e.clientY-startY
            );

        if(moveDist > 10)
            return;

        const rect =
            render.canvas
            .getBoundingClientRect();

        const mousePoint = {

            x:
                (
                    e.clientX -
                    rect.left
                ) *
                (
                    render.options.width /
                    rect.width
                ),

            y:
                (
                    e.clientY -
                    rect.top
                ) *
                (
                    render.options.height /
                    rect.height
                )
        };

        const clickedBodies =
            Query.point(
                skillBodies,
                mousePoint
            );

        if(clickedBodies.length > 0){

            showSkill(
                clickedBodies[0].label,
                e.clientX,
                e.clientY
            );

        }

    }
);

/* =========================
   DRAW SKILLS
========================= */

Events.on(
    render,
    "afterRender",
    ()=>{

        const ctx =
            render.context;

        skillBodies.forEach(
            body=>{

                const {
                    x,
                    y
                } =
                    body.position;

                ctx.save();

                ctx.translate(
                    x,
                    y
                );

                ctx.rotate(
                    body.angle
                );

                const speed =
                    Math.abs(
                        body.velocity.x
                    ) +
                    Math.abs(
                        body.velocity.y
                    );

                ctx.shadowColor =
                    "#00ff66";

                ctx.shadowBlur =
                    speed > 2
                    ? 22
                    : 5;

                ctx.font =
                    "13px Space Grotesk";

                ctx.fillStyle =
                    "#ffffff";

                ctx.textAlign =
                    "center";

                ctx.textBaseline =
                    "middle";

                ctx.fillText(
                    body.label,
                    0,
                    0
                );

                ctx.restore();

            }
        );

    }
);

function createParticles(

){

    for(

        i++

        const p =
            document.createElement(
                "div"
            );

        p.className =
            "particle";

        p.style.left =

        p.style.top =
            y+"px";

        p.style.setProperty(
            "--dx",
            (
                (Math.random()-.5)*220
            )+"px"
        );

        p.style.setProperty(
            "--dy",
            (
                (Math.random()-.5)*220
            )+"px"
        );

        document.body.appendChild(
            p
        );

        setTimeout(
            ()=>p.remove(),
            800
        );
    }
}

function createRipple(
    x,
    y
){

    const ripple =
        document.createElement(
            "div"
        );

    ripple.className =
        "ripple";

    ripple.style.left =
        x+"px";

    ripple.style.top =
        y+"px";

    document.body.appendChild(
        ripple
    );

    setTimeout(
        ()=>ripple.remove(),
        700
    );
}
